name: test

on:
  push:
    branches: [ "master" ]
  schedule:
    - cron: '45 3 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
    - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

    - name: start postgres
      run: |
        sudo systemctl start postgresql.service
        pg_isready
        sudo -u postgres psql --command="CREATE USER ci PASSWORD 'ci' SUPERUSER" --command="\du"
        sudo -u postgres psql --command="CREATE DATABASE warehouse_test WITH OWNER=ci" --command="\du"

    - uses: ruby/setup-ruby@19a9babd0096de1a2aa716cac395f01253934999
      with:
        ruby-version: 3.3.4

    - uses: actions/setup-node@efcb663fc60e97218a2b2d6d827f7830f164739e
      with:
        node-version: '22.14.0'

    - name: bundle
      id: bundle
      run: |
        gem install bundler
        bundle install --jobs 4 --retry 3

    - name: npm ci
      run: cd web && npm ci

    - name: build web
      run: cd web && npm run build

    - name: server spec
      timeout-minutes: 1
      run: bundle exec rake server:spec

    - name: vitest
      timeout-minutes: 1
      run: cd web && npx vitest run

    - name: checks
      run: bundle exec rake checks

    - name: pushover notification
      if: failure()
      env:
        PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
        PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
      run: |
        curl -sS --fail-with-body \
          --form-string "token=$PUSHOVER_TOKEN" \
          --form-string "user=$PUSHOVER_USER" \
          --form-string "title=${{ github.repository }} CI failed (${{ github.workflow }})" \
          --form-string "message=job status: ${{ job.status }}" \
          --form-string "url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
          https://api.pushover.net/1/messages.json
