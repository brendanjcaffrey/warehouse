name: ios

on:
  push:
    branches: [ "master" ]
    paths:
      - 'ios/**'
      - 'export/**'
      - 'shared/config.rb'
      - 'Gemfile'
      - 'Gemfile.lock'
      - 'Rakefile'
      - 'check_swiftlint.sh'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - 'export/**'
      - 'shared/config.rb'
      - 'Gemfile'
      - 'Gemfile.lock'
      - 'Rakefile'
      - 'check_swiftlint.sh'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

# ios steps mirror the rake tasks with explicit ci signing and diagnostics.
# exporter tests use rake with isolated postgres fixtures and no music access.
env:
  PROJECT: ios/Warehouse.xcodeproj
  SCHEME: Warehouse
  # concrete, bootable simulator (xcodebuild test can't use a generic
  # destination). override here if the runner image drops this device.
  SIMULATOR: iPhone 18 Pro

jobs:
  ios:
    runs-on: xcode-27
    timeout-minutes: 40

    steps:
    - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

    - name: install postgres
      run: |
        brew install postgresql@17
        echo "$(brew --prefix postgresql@17)/bin" >> "$GITHUB_PATH"
        echo "BUNDLE_BUILD__PG=--with-pg-config=$(brew --prefix postgresql@17)/bin/pg_config" >> "$GITHUB_ENV"

    - uses: ruby/setup-ruby@19a9babd0096de1a2aa716cac395f01253934999
      with:
        ruby-version: 3.3.4
        bundler-cache: true

    - name: start export test postgres
      env:
        PGPASSWORD: ci
      run: |
        printf '%s\n' "$PGPASSWORD" > "$RUNNER_TEMP/export-postgres-password"
        initdb -D "$RUNNER_TEMP/export-postgres" -U ci \
          --auth-local=trust --auth-host=scram-sha-256 \
          --pwfile="$RUNNER_TEMP/export-postgres-password" --encoding=UTF8 --locale=C
        rm "$RUNNER_TEMP/export-postgres-password"
        pg_ctl -D "$RUNNER_TEMP/export-postgres" -l "$RUNNER_TEMP/export-postgres.log" \
          -o '-h localhost -p 5432' -w start
        createdb -h localhost -U ci warehouse_test

    - name: export tests
      run: bundle exec rake export:test

    - name: stop export test postgres
      if: always()
      run: |
        if [ -f "$RUNNER_TEMP/export-postgres/postmaster.pid" ]; then
          pg_ctl -D "$RUNNER_TEMP/export-postgres" -m fast -w stop
        fi
        if [ -f "$RUNNER_TEMP/export-postgres.log" ]; then
          cat "$RUNNER_TEMP/export-postgres.log"
        fi

    - name: swiftlint
      run: |
        brew install swiftlint
        rake -f ios/lint.rake ios:lint

    - name: build
      run: |
        xcodebuild -project "$PROJECT" \
          -scheme "$SCHEME" \
          -destination 'generic/platform=iOS Simulator' \
          -configuration Debug \
          CODE_SIGNING_ALLOWED=NO \
          build

    # signed ad hoc rather than not at all: an unsigned test host has no
    # entitlements, so the simulator keychain refuses every write & the auth
    # tests that read a token back see nothing. ad hoc needs no team/profile
    # unrelated suites contend for the main actor on hosted runners; run them
    # serially, matching rake ios:test, and avoid optional diagnostic stalls.
    # keep the host-sensitive 100 ms profile in local runs.
    - name: unit tests
      id: unit-tests
      run: |
        xcodebuild test -project "$PROJECT" \
          -scheme "$SCHEME" \
          -destination "platform=iOS Simulator,name=$SIMULATOR" \
          -parallel-testing-enabled NO \
          -collect-test-diagnostics never \
          -resultBundlePath "$RUNNER_TEMP/ios-unit-tests.xcresult" \
          -only-testing:WarehouseTests \
          '-skip-testing:WarehouseTests/WatchContentWorkerTests/responsiveness()' \
          CODE_SIGN_IDENTITY=- \
          CODE_SIGN_STYLE=Manual \
          DEVELOPMENT_TEAM= \
          PROVISIONING_PROFILE_SPECIFIER=

    - name: unit test failure summary
      if: ${{ !cancelled() && steps.unit-tests.outcome == 'failure' }}
      run: |
        if [ -d "$RUNNER_TEMP/ios-unit-tests.xcresult" ]; then
          python3 - "$RUNNER_TEMP/ios-unit-tests.xcresult" <<'PY'
        import json
        import subprocess
        import sys

        bundle = sys.argv[1]
        command = ["xcrun", "xcresulttool", "get", "test-results"]
        summary = subprocess.check_output(command + ["summary", "--path", bundle], text=True)
        print(summary, end="", flush=True)
        test_ids = dict.fromkeys(failure["testIdentifierString"] for failure in json.loads(summary)["testFailures"])
        for test_id in test_ids:
            subprocess.run(command + ["test-details", "--path", bundle, "--test-id", test_id], check=True)
        PY
        else
          echo 'unit test result bundle unavailable; xcodebuild may have failed before tests ran'
        fi

    - name: upload unit test results
      if: ${{ !cancelled() && steps.unit-tests.outcome == 'failure' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: ios-unit-test-results
        path: ${{ runner.temp }}/ios-unit-tests.xcresult
        include-hidden-files: true
        retention-days: 14
        overwrite: true

    - name: ui tests
      run: |
        xcodebuild test -project "$PROJECT" \
          -scheme "$SCHEME" \
          -destination "platform=iOS Simulator,name=$SIMULATOR" \
          -only-testing:WarehouseUITests \
          CODE_SIGNING_ALLOWED=NO

    - name: pushover notification
      if: failure()
      env:
        PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
        PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
      run: |
        curl -sS --fail-with-body \
          --form-string "token=$PUSHOVER_TOKEN" \
          --form-string "user=$PUSHOVER_USER" \
          --form-string "title=${{ github.repository }} CI failed (${{ github.workflow }})" \
          --form-string "message=job status: ${{ job.status }}" \
          --form-string "url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
          https://api.pushover.net/1/messages.json
